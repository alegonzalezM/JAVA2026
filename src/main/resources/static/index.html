<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel de Control - E-commerce</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container" style="text-align: center; max-width: 500px; margin:100px 33%;">
    <h2>Sistema de Gestión E-commerce</h2>
    <p>Selecciona el módulo con el que deseas trabajar:</p>
    <br>
    
    <div class="actions" style="display: flex; flex-direction: column; gap: 15px;">
        <a href="productos.html" class="btn-read" style="text-decoration: none; padding: 15px; display: block; background-color: tomato; color: white; font-weight: bold; border-radius: 4px;">
            📦 Gestionar Productos
        </a>
        <a href="clientes.html" class="btn-create" style="text-decoration: none; padding: 15px; display: block; background-color: #28a745; color: white; font-weight: bold; border-radius: 4px;">

        </a>
        <!-- NUEVO: Botón de acceso al módulo de Administración -->
        <a href="admin.html" class="btn-admin" style="text-decoration: none; padding: 15px; display: block; background-color: #6c757d; color: white; font-weight: bold; border-radius: 4px;">

        </a>
    </div>
</div>

</html>
